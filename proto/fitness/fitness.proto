syntax = "proto3";

package fitness;

option go_package = "LiveisFPV.fitness.v1;fitness_v1";

service Fitness{
    rpc GetUser (ProfileRequest) returns (ProfileResponse);
    rpc CreateUser (CreateProfileRequest) returns (ProfileResponse);
    rpc UpdateUser (UpdateProfileRequest) returns (ProfileResponse);
    rpc GetPlanDishes (GetPlanDishesRequest) returns (PlanDishesResponse);
    rpc GetPlanTrain (GetPlanTrainRequest) returns(PlanTrainResponse);
    rpc GetHistory (GetHistoryRequest) returns (HistoryResponse);
    rpc GetTrainInstr (GetTrainInstrRequest) returns (TrainInstrResponse);
    rpc GetRecipe (GetRecipeRequest) returns (RecipeResponse);
}

message ProfileResponse{
    string user_firstname = 1;
    string user_lastname = 2;
    optional string user_middlename = 3;
    string user_birthday = 4;
    int32 user_height = 5;
    double user_weight = 6;
    string user_fitness_target = 7;
    bool user_sex = 8;
    int32 user_level = 9;
}

message ProfileRequest{
    int64 user_id = 1;
}

message CreateProfileRequest{
    int64 user_id = 1;
    string user_firstname = 2;
    string user_lastname = 3;
    optional string user_middlename = 4;
    string user_birthday = 5;
    int32 user_height = 6;
    double user_weight = 7;
    string user_fitness_target = 8;
    bool user_sex = 9;
    optional int32 user_level = 10;
}

message UpdateProfileRequest{
    int64 user_id = 1;
    optional string user_firstname = 2;
    optional string user_lastname = 3;
    optional string user_middlename = 4;
    optional string user_birthday = 5;
    optional int32 user_height = 6;
    optional double user_weight = 7;
    optional string user_fitness_target = 8;
    optional bool user_sex = 9;
    optional int32 user_level = 10;
}
message GetPlanTrainRequest{
    int64 user_id = 1;
}
message GetPlanDishesRequest{
    int64 user_id = 1;
}
message PlanTrain{
    int64 train_id = 1;
    string train_title = 2;    
	string train_description = 3;
	int64 user_level = 4;
    string date = 5;
    int64 user_id = 6;
}

message PlanTrainResponse{
    repeated PlanTrain data = 1;
}
message PlanDishes{
    int64 dishes_id = 1;
    double dishes_weight = 2;
    string time = 3;
    double kcal = 4;
    double fat = 5;
    double protein = 6;
    double carbs = 7;
    double description = 8;
    string date = 9;
    int64 user_id = 10;
}

message PlanDishesResponse{
    repeated PlanDishes data = 1;
}

message GetHistoryRequest{
    int64 user_id = 1;
}

message History{
    double user_weight = 1;
    string date = 2;
}

message HistoryResponse{
    repeated History data = 1;
}

message GetTrainInstrRequest{
    int64 train_id = 1;
}

message GetRecipeRequest{
    int64 dishes_id = 1;
}

message TrainInstr{
    int64 training_order = 1;
    string training_instr = 2;
    string  training_img = 3;
}

message TrainInstrResponse{
    repeated TrainInstr data = 1;
}

message Recipe{
    int64 recipe_order = 1;
    string recipe_instruct = 2;
    string  recipe_img = 3;
}

message RecipeResponse{
    repeated Recipe data = 1;
}
/*
For generation
protoc -I proto proto/fitness/fitness.proto --go_out=./gen/go/ --go_opt=paths=source_relative --go-grpc_out=./gen/go/ --go-grpc_opt=paths=source_relative
-I proto way to proto file
--go_out - where is create go-code
--go_opt - how to create package name
--go-grpc_out - where to create go grpc-code
--go-grpc_opt - how to create grpc package name
*/